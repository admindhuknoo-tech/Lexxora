services:
  lexicore:
    build: .
    image: lexicore:v6.12.0
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 3000
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
      ANALYSIS_RATE_LIMIT_PER_MIN: ${ANALYSIS_RATE_LIMIT_PER_MIN:-6}
      EXTERNAL_HEALTH_RATE_LIMIT_PER_MIN: ${EXTERNAL_HEALTH_RATE_LIMIT_PER_MIN:-10}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
    ports:
      - "127.0.0.1:${LEXICORE_PORT:-3000}:3000"
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
